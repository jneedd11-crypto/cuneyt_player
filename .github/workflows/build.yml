name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Project Zip
      run: |
        echo "Listing files:"
        ls -la
        # فك أي ملف zip موجود في المستودع
        if ls *.zip 1> /dev/null 2>&1; then
          unzip -o '*.zip' -d extracted_project
          # نقل المحتويات إلى المجلد الرئيسي للمستودع
          rsync -avm --exclude='.*' extracted_project/*/ ./ || cp -r extracted_project/*/* ./ || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IBO-Xtream-Player-APK
        path: app/build/outputs/apk/debug/app-debug.apk
