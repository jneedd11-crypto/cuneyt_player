name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract ZIP Project
      run: |
        echo "=== Extracting ZIP files ==="
        for f in *.zip; do
          [ -e "$f" ] || continue
          unzip -o "$f"
        done
        
        # إذا كانت الملفات مستخرجة داخل مجلد فرعي، نخرجها للجذر
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          SUBDIR=$(find . -maxdepth 2 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
            echo "Moving files from $SUBDIR to root..."
            cp -r $SUBDIR/* .
          fi
        fi
        
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IBO-Xtream-Player-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
