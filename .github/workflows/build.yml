name: Build Android APK Direct

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find and Build Project
      run: |
        echo "Searching for build.gradle files..."
        find . -name "build.gradle" -o -name "build.gradle.kts"
        
        # إذا وجدنا ملفات المشروع في مجلد فرعي، ننتقل إليه للبناء
        PROJECT_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1))
        if [ "$PROJECT_DIR" != "." ] && [ -n "$PROJECT_DIR" ]; then
          echo "Moving to project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
        fi

        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          gradle assembleDebug --stacktrace
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IBO-Xtream-Player-APK
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
