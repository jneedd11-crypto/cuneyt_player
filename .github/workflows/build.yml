name: Build Android APK from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Find and Extract Zip
      run: |
        echo "Searching for zip files..."
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found zip file: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted_files
          
          # نقل محتويات المجلد المستخرج إلى الجذر الرئيسي للمستودع
          cp -r extracted_files/*/* extracted_files/*/.* . 2>/dev/null || cp -r extracted_files/*/. . 2>/dev/null || cp -r extracted_files/* .
        else
          echo "Error: No zip file found in root!"
          exit 1
        }
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IBO-Xtream-Player-APK
        path: app/build/outputs/apk/debug/app-debug.apk
